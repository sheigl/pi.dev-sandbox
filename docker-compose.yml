# docker-compose.yml
version: "3.9"

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    hostname: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # --- Provider keys (only visible inside litellm, NOT passed to pi-sandbox) ---
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  pi-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi-sandbox
    hostname: pi-sandbox
    stdin_open: true
    tty: true
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      # Your code
      - /home/sheigl/code:/workspace:cached
      # Pi config, sessions, and cache on the host filesystem
      - ./data/pi:/home/dev/.pi
      # Node modules cache on the host filesystem
      - ./data/npm:/home/dev/.npm-global
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    environment:
      - HOME=/home/dev
      - NODE_ENV=development
      # --- Route all LLM calls through litellm proxy ---
      # Virtual key is REQUIRED — no fallback to master key
      - OPENAI_API_KEY=${LITELLM_VIRTUAL_KEY:?Set LITELLM_VIRTUAL_KEY in .env}
      - OPENAI_BASE_URL=http://litellm:4000
      # --- Named virtual keys (available for -e overrides at runtime) ---
      - LITELLM_VKEY_FULL=${LITELLM_VKEY_FULL:-}
      - LITELLM_VKEY_BUDGET=${LITELLM_VKEY_BUDGET:-}
      - LITELLM_VKEY_CODING=${LITELLM_VKEY_CODING:-}
      - LITELLM_VKEY_READONLY=${LITELLM_VKEY_READONLY:-}
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G